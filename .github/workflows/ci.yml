name: CI/CD - Biblioteca Online

on:
  push:
    branches:
      - main
      - atividade-nuvem

  pull_request:
    branches:
      - main
      - atividade-nuvem

jobs:
  testes:
    name: Executar testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: chave-exclusiva-para-testes-automatizados

    deploy:
    name: Publicar no Render
    runs-on: ubuntu-latest
    needs: testes

    if: github.event_name == 'push' && github.ref == 'refs/heads/atividade-nuvem'

    steps:
      - name: Acionar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Erro: Deploy Hook não configurado."
            exit 1
          fi

          status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request POST \
            "$RENDER_DEPLOY_HOOK")

          echo "HTTP Status do Render: $status"

          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "Falha ao acionar o deploy."
            exit 1
          fi

          echo "Solicitação de deploy aceita pelo Render."
