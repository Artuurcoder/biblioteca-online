name: CI - Biblioteca Online

on:
  push:
    branches:
      - main
      - atividade-nuvem

  pull_request:
    branches:
      - main
      - atividade-nuvem

jobs:
  testes:
    name: Executar testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: chave-exclusiva-para-testes-automatizados
