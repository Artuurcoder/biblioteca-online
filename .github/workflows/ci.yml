name: CI/CD - Biblioteca Online

on:
  push:
    branches:
      - main
      - atividade-nuvem

  pull_request:
    branches:
      - main
      - atividade-nuvem

jobs:
  testes:
    name: Executar testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: chave-exclusiva-para-testes-automatizados

  deploy:
    name: Publicar no Render
    runs-on: ubuntu-latest
    needs: testes

    if: github.event_name == 'push' && github.ref == 'refs/heads/atividade-nuvem'

    steps:
      - name: Acionar deploy no Render
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
